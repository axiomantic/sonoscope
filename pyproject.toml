[project]
name = "sonoscope"
dynamic = ["version"]
description = "Audio-QA harness: (plugin, stimulus, param-set) -> wav -> versioned analysis JSON"
readme = "README.md"
requires-python = "==3.12.*"
authors = [{ name = "Elijah Shaw-Rutschman" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "audio",
    "audio-plugin",
    "vst",
    "clap",
    "audio-testing",
    "dsp",
    "python",
    "qa",
    "midi",
    "librosa",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "librosa==0.10.2",
    "mido==1.3.2",
    "numpy==1.26.4",
    "pedalboard==0.9.23",
    "pydantic>=2.7,<3",
    "soundfile==0.12.1",
    "soxr==1.1.0",
]

# Perception is an OPTIONAL extra (design §11.2 / §2.1): the deterministic core
# installs and runs without the ~16 GB Qwen2-Audio model stack.
#
# RUNTIME: the perception path runs on the transformers reference runtime, NOT
# Nexa-SDK-GGUF. The GGUF-only `nexa-gguf` package is a file-format library
# (readers/writers/converters), NOT an inference engine (no `describe()`, no
# `nexa` CLI, no Metal), and has no installable macOS/arm64 wheel. The model runs
# as Qwen2-Audio-7B-Instruct via `transformers` + `torch` on MPS (Metal), fp16 —
# a real audio-in `describe()` that discriminates brightness/pitch/noise.
# Model WEIGHTS are acquired out-of-band (pinned + sha256-verified) via
# `scripts/fetch_qwen_model.sh` / `pins/qwen_model.manifest.toml`, not pip.
[project.optional-dependencies]
perception = [
    "transformers==4.57.6",  # Qwen2AudioForConditionalGeneration + AutoProcessor
    "torch==2.2.2",          # MPS/Metal backend on Apple Silicon
]

[project.scripts]
sonoscope = "sonoscope.cli:main"

[project.urls]
Homepage = "https://github.com/axiomantic/sonoscope"
Repository = "https://github.com/axiomantic/sonoscope"
Documentation = "https://github.com/axiomantic/sonoscope/blob/main/docs/using-sonoscope.md"
Issues = "https://github.com/axiomantic/sonoscope/issues"

[dependency-groups]
dev = [
    "jsonschema>=4,<5",
    "pytest>=8,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/sonoscope/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sonoscope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "integration: requires external artifacts (Surge XT / test plugin / Qwen model); deselected by default in unit CI",
]
