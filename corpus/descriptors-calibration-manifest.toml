"""
out_of_scope_for_signature = """
NOT required for the signature (they are the POST-APPROVAL calibration commit,
gated by [methodology].sha256_precondition and .on_approval):
  - real per-clip sha256 digests (every clip.sha256 stays "TBD" by design here),
