#   and re-pin its sibling `thresholds_sha256`. Until this manifest is approved AND a
#   real calibration run produces final numbers, every value in `DERIVER_THRESHOLDS`
#   (and `EXPECTED_THRESHOLDS_SHA256` in the T2 drift-anchor test) is a PLACEHOLDER.
#   On approval, a SEPARATE follow-up commit swaps calibrated numbers in and re-pins
#   the digest. This proposal commit does NOT freeze any number.
#
# PLACEHOLDER PROVENANCE (dehallucination — F12):
#   Every `path`, `source`, and `sha256` below is a clearly-marked "TBD" placeholder.
#   No fabricated URLs, no invented 64-hex digests, no guessed licenses. The go/no-go
#   review is about CORPUS COMPOSITION, LICENSING POLICY, and METHODOLOGY — none of
#   which need real digests. See [methodology].sha256_precondition for the hard rule
#   on resolving TBD -> real digest BEFORE the calibration run.
#
# LICENSING POLICY (HARD CONSTRAINT): CC0 or CC-BY ONLY. No other license is eligible.
#   In-repo redistribution PLUS this project's licensing policy make every NC/SA/ND variant —
#   CC-BY-NC, CC-BY-SA, CC-BY-ND (and combinations) — INELIGIBLE. Per-clip license
#   vetting BEFORE commit is LOAD-BEARING: candidate libraries (Freesound, cctrax,
#   archive.org CC collections) routinely host CC-BY-NC / CC-BY-SA / CC-BY-ND clips
#   INTERLEAVED with eligible material, so NO library is pre-trusted as a whole — the
#   license is verified per individual clip, never inferred from the host. Each clip's
#   verified license + attribution/provenance is recorded in-manifest at sourcing time;
#   the specific per-clip source URL is resolved during sourcing, not fabricated now.
#
# SAMPLE RATE: 48000 Hz, matching FROZEN_PARAMS.sr exactly
#   (src/sonoscope/features/librosa_features.py — `"sr": 48000`). NO resample:
#   compute_summary() rejects any clip whose rate != the frozen sr.
# =============================================================================

