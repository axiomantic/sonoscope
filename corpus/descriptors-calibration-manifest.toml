# -----------------------------------------------------------------------------
# [methodology] — how thresholds are DERIVED from this corpus (design §10, Q7).
# Recorded here so a reviewer can reproduce every boundary at calibration time.
# -----------------------------------------------------------------------------
[methodology]
status = "PROPOSAL — pending maintainer sign-off"

# ABSOLUTE, NOT percentile/relative. For each MEASURED single-metric term:
#   1. Compute the term's mapped metric (DeterministicSummary field) over the
#      POSITIVE exemplar set (clips whose `labels` include the term) and over the
#      NEGATIVE set (clips whose `neg_labels` include the term).
#   2. If the two sets are SEPARABLE (high-direction term:
#      min(metric over positives) > max(metric over negatives); low-direction term:
#      max(metric over positives) < min(metric over negatives)), set the threshold at
#      the SEPARATING BOUNDARY = midpoint between the two touching extremes.
#   3. If the sets OVERLAP, DO NOT silently pick a percentile. FLAG the term for
#      re-labeling or exemplar curation and resolve before freeze.
measured_boundary_rule = """
threshold = midpoint( max(metric over negatives), min(metric over positives) )   # high-direction term
threshold = midpoint( max(metric over positives), min(metric over negatives) )   # low-direction (dark, quiet, spare) term
overlap => FLAG term for re-labeling / curation; never fall back to a percentile.
"""

# BOUNDARY STABILITY: midpoint(max-neg, min-pos) is fixed by EXACTLY the two touching
# boundary clips, so at the >=2/>=2 floor a single outlier or mislabel fully determines a
# boundary. The TIGHTEST terms — dark (spectral_centroid low-direction) and dynamic
# (crest_factor high-direction) — are therefore held to >=3 POSITIVE AND >=3 NEGATIVE
# exemplars, so no single clip alone sets their boundary. (All other measured terms remain
# at the >=2/>=2 floor; revisit if calibration reveals a fragile boundary.)
boundary_stability = """
tightest terms dark, dynamic: >=3 positive AND >=3 negative exemplars (harden against single-clip boundaries).
all other measured terms: >=2/>=2 floor.
"""

# TOOLCHAIN RECORDING: params_sha256 / thresholds_sha256 pin derived VALUES, not the library
# that produced them. Cross-version float drift in librosa/numpy could move a touching
# boundary clip and thus a threshold. At calibration time, RECORD the exact toolchain
# (librosa + numpy versions, and Python version) ALONGSIDE the derived numbers, so a later
# re-run can distinguish a genuine corpus change from library float drift.
toolchain_recording = "At calibration time, record librosa + numpy + Python versions next to derived numbers (sha256 pins values, not the library; guards against cross-version float drift on boundary clips)."

# Metric map (design §5.1) the deriver reads for each measured term:
#   bright/dark  -> spectral_centroid_hz   (high / low)
#   loud/quiet   -> rms_dbfs               (high / low)
#   compressed/dynamic -> crest_factor_db  (low / high)
#   busy/spare   -> onset_rate_hz          (high / low)
#   dense        -> onset_rate_hz AND spectral_bandwidth_hz (AND-of-per-metric; "sparse" = dense-negative)
metric_map = """
bright=spectral_centroid_hz(high); dark=spectral_centroid_hz(low)
loud=rms_dbfs(high); quiet=rms_dbfs(low)
compressed=crest_factor_db(low); dynamic=crest_factor_db(high)
busy=onset_rate_hz(high); spare=onset_rate_hz(low)
dense=onset_rate_hz(high) AND spectral_bandwidth_hz(high)
"""

# DENSE is the only measured term with TWO input axes, and each axis is calibrated on its
# OWN separating boundary against its OWN negative pole — they are NOT calibrated jointly:
#   AXIS 1 (onset_rate_hz, high-direction): busy-vs-spare separating boundary. Positives =
#     dense/busy clips; negatives = the spare/sparse pole (spare-*, sparse anchors).
#   AXIS 2 (spectral_bandwidth_hz, high-direction): calibrated against a BUSY-but-NARROW-band
#     negative so the bandwidth floor is not silently set by an onset-sparse clip. The anchor
#     is `dense-neg-narrowband-001` (high onset_rate, NARROW spectral_bandwidth, carries
#     `dense` in neg_labels). Without it, every dense-negative would be onset-sparse and the
#     bandwidth axis could not honor the separating-boundary discipline.
#   FALLBACK: if a clean busy-but-narrow exemplar proves unavailable at sourcing (or fails
#     license vetting), the bandwidth axis falls back to the corpus min/max normalization for
#     spectral_bandwidth_hz instead of a separating boundary. This fallback is stated
#     explicitly so the doc matches what is achievable; onset_rate AXIS 1 is unaffected.
dense_two_axis = """
axis1 onset_rate_hz: separating boundary busy(positive) vs spare/sparse(negative).
axis2 spectral_bandwidth_hz: separating boundary vs busy-but-NARROW anchor dense-neg-narrowband-001.
fallback (axis2 only): if no clean busy-narrow exemplar sources/vets, use corpus min/max for bandwidth.
bandwidth_hz_min therefore has an explicit separating negative and is not set by an onset-sparse clip.
"""

# HYBRID composites (driving, punchy, warm): weights are FIXED BY DESIGN (§5.2) and are
# NOT calibrated. Only the per-metric lo/hi NORMALIZATION bounds are calibrated, from the
# corpus min/max of each input metric; then `fire` is set to separate positive vs negative
# composite scores. Same separable/overlap discipline as the measured terms.
hybrid_rule = """
weights: FIXED by design (§5.2), not calibrated.
lo/hi normalization bounds: calibrated from corpus min/max of each input metric.
fire threshold: set to separate positive-vs-negative composite scores (separable => midpoint; overlap => FLAG).
"""

# HYBRID NEGATIVE SETS (explicit): "fire separates positive-vs-negative composite" needs a
# DEFINED negative pool per composite, else the boundary is undefined. Each hybrid's negative
# pool = the opposite-pole exemplars carrying the hybrid term in `neg_labels`, plus the global
# neutral control. Every hybrid below has a NON-EMPTY, explicit negative set:
#   driving (busy+fast+loud): negatives = quiet-001, spare-002, cosmic-001, neutral-001
#     (spacious / quiet / spare = the not-driving pole).
#   punchy  (high crest + transient onsets): negatives = compressed-001, compressed-002,
#     neutral-001 (compressed / low-crest = the not-punchy pole).
#   warm    (low centroid + low-mid energy): negatives = bright-001, bright-002, neutral-001
#     (bright / high-centroid = the not-warm pole).
hybrid_negative_sets = """
driving- = quiet-001, spare-002, cosmic-001, neutral-001
punchy-  = compressed-001, compressed-002, neutral-001
warm-    = bright-001, bright-002, neutral-001
each pool is non-empty; membership is authoritative via each clip's neg_labels below.
"""

# Provenance recording (at calibration time, NOT in this proposal): for every derived
# value, record the contributing clip-ids and the raw metric values that set the boundary,
# so the number is reproducible and auditable by a reviewer.
provenance_recording = "At calibration time, record per-term: derived value + contributing clip-ids + raw metric extremes."

# HARD PRECONDITION (F12): every `sha256 = "TBD"` below MUST be resolved to a real
# 64-hex digest of the actual sourced audio file BEFORE the calibration run. You cannot
# calibrate against un-pinned clips. This is a precondition of the POST-APPROVAL
# calibration commit, not of this proposal commit.
sha256_precondition = "All TBD -> real 64-hex digest of sourced file required before calibration run (not before this proposal)."

# On approval: a follow-up commit (a) resolves all TBD digests, (b) runs calibration,
# (c) swaps derived numbers into DERIVER_THRESHOLDS, (d) re-pins thresholds_sha256 and
